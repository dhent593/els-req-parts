<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ELS Computer - Service App</title>
  <!-- Favicon -->
  <link rel="icon" href="https://www.google.com/s2/favicons?domain=els.id&sz=32" type="image/x-icon">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- SheetJS & DataTables -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.13.1/css/jquery.dataTables.css">
  <script type="text/javascript" charset="utf8" src="https://cdn.datatables.net/1.13.1/js/jquery.dataTables.js"></script>
  <!-- QR Code Lib for Printing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <!-- JsBarcode for 1D Barcodes -->
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in { animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    .dataTables_wrapper .dataTables_filter { margin-bottom: 1rem; }
    .dataTables_wrapper .dataTables_filter input { 
      border: 1px solid #e2e8f0; border-radius: 0.75rem; padding: 0.5rem 1rem; outline: none;
      background-color: #f8fafc; transition: all 0.2s; font-size: 0.875rem; width: 250px;
    }
    .dataTables_wrapper .dataTables_filter input:focus { 
      border-color: #f97316; box-shadow: 0 0 0 3px rgba(249,115,22,0.15); background-color: #fff;
    }
    .dataTables_wrapper .dataTables_length select { 
      border: 1px solid #e2e8f0; border-radius: 0.5rem; padding: 0.3rem 0.5rem; 
      outline: none; background-color: #f8fafc; font-size: 0.875rem; font-weight: 500;
    }
    .dataTables_wrapper .dataTables_length select:focus { border-color: #f97316; }
    .dataTables_wrapper .dataTables_info { font-size: 0.875rem; color: #64748b; padding-top: 1rem; }
    
    table.dataTable.no-footer { border-bottom: none !important; }
    .loader { border: 3px solid #f3f3f3; border-top: 3px solid #f97316; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    
    /* DataTable Pagination Overrides */
    .dataTables_wrapper .dataTables_paginate { padding-top: 1rem !important; }
    .dataTables_wrapper .dataTables_paginate .paginate_button {
      border: none !important; background: none !important; padding: 0.4rem 0.8rem !important; margin: 0 0.2rem !important;
      border-radius: 0.5rem !important; font-size: 0.85rem !important; font-weight: 600 !important;
      color: #64748b !important; transition: all 0.2s ease-in-out; cursor: pointer;
    }
    .dataTables_wrapper .dataTables_paginate .paginate_button:hover { background: #f1f5f9 !important; color: #f97316 !important; }
    .dataTables_wrapper .dataTables_paginate .paginate_button.current, .dataTables_wrapper .dataTables_paginate .paginate_button.current:hover {
      background: #fff7ed !important; color: #ea580c !important; border: 1px solid #ffedd5 !important; box-shadow: 0 1px 2px 0 rgba(0,0,0,0.05);
    }
    .dataTables_wrapper .dataTables_paginate .paginate_button.disabled { opacity: 0.5; cursor: not-allowed; }

    
    /* Print Styles */
    @media print {
      body * { visibility: hidden; }
      #printContainer, #printContainer * { visibility: visible; }
      #printContainer { position: absolute; left: 0; top: 0; width: 100%; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="text-slate-800">

  <!-- PRINT CONTAINER -->
  <div id="printContainer" class="hidden absolute top-0 left-0 bg-white z-[9999] p-4 w-full h-full"></div>

  <!-- LOADING -->
  <div id="loadingOverlay" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[999] flex items-center justify-center hidden">
    <div class="bg-white p-6 rounded-2xl shadow-2xl text-center">
      <div class="loader mb-4"></div>
      <p class="text-slate-700 font-medium" id="loadingText">Memproses Data...</p>
    </div>
  </div>

  <!-- LOGIN -->
  <div id="loginView" class="min-h-screen flex items-center justify-center bg-slate-50 relative overflow-hidden">
    <div class="absolute top-0 left-0 w-96 h-96 bg-orange-200 rounded-full mix-blend-multiply filter blur-3xl opacity-50 -translate-x-1/2 -translate-y-1/2"></div>
    <div class="absolute bottom-0 right-0 w-96 h-96 bg-orange-300 rounded-full mix-blend-multiply filter blur-3xl opacity-50 translate-x-1/2 translate-y-1/2"></div>
    
    <div class="bg-white p-10 rounded-3xl shadow-xl w-full max-w-md relative z-10 animate-fade-in mx-4">
      <div class="text-center mb-8">
        <img src="https://www.google.com/s2/favicons?domain=els.id&sz=128" alt="ELS Logo" class="w-16 h-16 mx-auto mb-4 object-contain drop-shadow-sm">
        <h1 class="text-2xl font-bold text-slate-900">ELS Computer</h1>
        <p class="text-sm text-slate-500 font-medium mt-1">Service Division Portal</p>
      </div>
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="mb-5">
          <label class="block text-slate-700 text-sm font-semibold mb-2">Username</label>
          <input type="text" id="username" placeholder="Masukkan username Anda" class="w-full px-4 py-3 bg-slate-50 border rounded-xl focus:ring-2 focus:ring-orange-500/50" required>
        </div>
        <div class="mb-6">
          <label class="block text-slate-700 text-sm font-semibold mb-2">Password</label>
          <div class="relative">
            <input type="password" id="password" placeholder="Masukkan password Anda" class="w-full px-4 py-3 bg-slate-50 border rounded-xl focus:ring-2 focus:ring-orange-500/50 pr-12" required>
            <button type="button" onclick="togglePassword()" class="absolute inset-y-0 right-0 px-4 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none">
              <i id="eyeIcon" class="fas fa-eye text-lg"></i>
            </button>
          </div>
        </div>
        <div class="mb-8 flex items-center">
          <input type="checkbox" id="rememberMe" checked class="w-4 h-4 text-orange-600 bg-slate-50 border-slate-300 rounded focus:ring-orange-500 cursor-pointer">
          <label for="rememberMe" class="ml-2 text-sm font-medium text-slate-700 cursor-pointer">Ingat Saya</label>
        </div>
        <button type="submit" class="w-full bg-orange-600 text-white font-semibold py-3 px-4 rounded-xl hover:bg-orange-700 transition-all">Sign In</button>
      </form>
    </div>
  </div>

  <!-- APP VIEW -->
  <div id="appView" class="hidden flex h-screen overflow-hidden bg-slate-50 relative">
    
    <!-- Sidebar Overlay (Mobile) -->
    <div id="sidebarOverlay" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-20 hidden md:hidden transition-opacity" onclick="toggleSidebar()"></div>

    <!-- Chat Drawer Overlay -->
    <div id="chatDrawerOverlay" class="fixed inset-0 bg-slate-900/20 backdrop-blur-sm z-[40] hidden transition-opacity" onclick="toggleChatDrawer()"></div>

    <!-- Chat Drawer -->
    <div id="chatDrawer" class="fixed inset-y-0 right-0 w-full md:w-96 bg-white shadow-2xl z-[50] transform translate-x-full transition-transform duration-300 ease-in-out flex flex-col">
      <!-- header -->
      <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-white shadow-sm z-10">
        <div class="flex items-center gap-3">
          <button id="btnBackChat" onclick="closeChatThread()" class="hidden text-slate-400 hover:text-orange-500 transition"><i class="fas fa-arrow-left"></i></button>
          <h3 class="font-bold text-slate-800" id="chatDrawerTitle">Pesan</h3>
        </div>
        <button onclick="toggleChatDrawer()" class="text-slate-400 hover:text-red-500 transition w-8 h-8 flex items-center justify-center rounded-full hover:bg-red-50"><i class="fas fa-times"></i></button>
      </div>
      <!-- body -->
      <div id="chatDrawerBody" class="flex-1 overflow-y-auto bg-slate-50 relative p-4 flex flex-col gap-3">
          <div class="flex items-center justify-center h-full text-slate-400"><i class="fas fa-comment-dots text-4xl mb-3 block text-center w-full"></i></div>
      </div>
      <!-- input -->
      <div id="chatDrawerFooter" class="p-4 border-t border-slate-100 bg-white hidden shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-10">
         <form onsubmit="doSendChatMessage(event)" class="flex gap-2 relative">
             <input type="text" id="chatInput" class="flex-1 border border-slate-200 rounded-full pl-4 pr-12 py-3 text-sm focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500 transition-all bg-slate-50" placeholder="Ketik pesan..." required autocomplete="off">
             <button type="submit" id="btnSendChat" class="absolute right-1 top-1 bottom-1 bg-orange-500 hover:bg-orange-600 text-white w-10 h-10 rounded-full flex items-center justify-center transition-colors shadow-sm"><i class="fas fa-paper-plane text-sm"></i></button>
         </form>
      </div>
    </div>

    <aside id="sidebar" class="w-72 bg-white flex flex-col shadow-lg z-30 border-r border-slate-100 fixed inset-y-0 left-0 transform -translate-x-full md:relative md:translate-x-0 transition-transform duration-300 ease-in-out">
      <div class="p-6 flex items-center gap-4 border-b border-slate-100">
        <img src="https://www.google.com/s2/favicons?domain=els.id&sz=128" alt="ELS Logo" class="w-10 h-10 object-contain drop-shadow-sm">
        <div>
          <h2 class="text-lg font-bold text-slate-800">ELS Service</h2>
          <p class="text-xs font-semibold text-orange-600 tracking-wider" id="userRoleDisplay"></p>
        </div>
      </div>
      <nav class="flex-1 overflow-y-auto py-6 px-4 space-y-1" id="sidebarMenu"></nav>
      <div class="p-4 border-t border-slate-100">
        <button onclick="logout()" class="w-full flex items-center justify-center gap-2 bg-slate-50 hover:bg-red-50 text-slate-600 hover:text-red-600 font-medium py-3 rounded-xl transition-all"><i class="fas fa-sign-out-alt"></i> Logout</button>
      </div>
    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-hidden w-full">
      <header class="bg-white/80 backdrop-blur-md shadow-sm h-20 flex items-center justify-between px-4 md:px-8 z-10 sticky top-0 border-b border-slate-100">
        <div class="flex items-center gap-3">
          <button onclick="toggleSidebar()" class="md:hidden w-10 h-10 flex items-center justify-center bg-slate-50 text-slate-600 hover:bg-slate-100 rounded-xl focus:outline-none transition">
            <i class="fas fa-bars"></i>
          </button>
          <h2 class="text-xl md:text-2xl font-bold text-slate-800 tracking-tight truncate" id="pageTitle">Dashboard</h2>
        </div>
        <div class="flex items-center gap-3 md:gap-4 bg-white px-3 md:px-4 py-2 rounded-2xl shadow-sm border border-slate-100">
          <button onclick="toggleChatDrawer()" class="relative text-slate-400 hover:text-orange-500 transition mr-2" title="Pesan">
            <i class="fas fa-comment-dots text-xl"></i>
            <span id="chatUnreadDot" class="hidden absolute -top-1 -right-1 w-2.5 h-2.5 bg-red-500 border-2 border-white rounded-full"></span>
          </button>
          <div class="text-right">
            <p class="text-sm font-bold text-slate-800 capitalize" id="userNameDisplay"></p>
            <p class="text-xs text-slate-500 capitalize" id="userCabangDisplay"></p>
          </div>
          <div class="h-10 w-10 bg-orange-100 rounded-full flex items-center justify-center text-orange-600"><i class="fas fa-user"></i></div>
        </div>
      </header>
      <div class="flex-1 overflow-y-auto p-8 relative" id="contentArea"></div>
    </main>
  </div>

  <script>
    // ── Security: Mencegah XSS — escape semua data dari server sebelum inject ke HTML ──
    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function forceRefresh(btn) {
      if(!_currentView) return;
      
      const role = String(currentUser.role).toUpperCase();
      const cabang = currentUser.cabang;
      
      let cacheKey = null;
      let funcName = null;
      let funcArgs = [];
      let paintCallback = null;

      // Tentukan konfigurasi berdasarkan halaman aktif saat ini
      if(_currentView === 'Dashboard') {
        cacheKey = role === 'PUSAT' ? 'dashboard_v3_PUSAT' : `dashboard_v3_${role}_${cabang}`;
        funcName = 'getDashboardData';
        funcArgs = [currentUser.role, currentUser.cabang, true];
        paintCallback = (data) => { renderDashboard(); };
      } else if(_currentView === 'Stock / Pricelist') {
        cacheKey = 'masterData';
        funcName = 'getMasterData';
        funcArgs = [true];
        paintCallback = (data) => { renderStock(); };
      } else if(_currentView === 'SN Masuk') {
        cacheKey = 'snMasukData';
        funcName = 'getSNMasuk';
        funcArgs = [true];
        paintCallback = (data) => { renderSNMasuk(); };
      } else if(_currentView === 'List Request Cabang') {
        cacheKey = `reqCabang_PUSAT_${cabang}`;
        funcName = 'getRequestCabang';
        funcArgs = ['PUSAT', cabang, true];
        paintCallback = (data) => { renderRequestTable('PUSAT'); };
      } else if(_currentView === 'Riwayat Request Part') {
        cacheKey = `reqCabang_CABANG_${cabang}`;
        funcName = 'getRequestCabang';
        funcArgs = ['CABANG', cabang, true];
        paintCallback = (data) => { renderRequestTable('CABANG'); };
      } else if(_currentView === 'Riwayat SN Keluar') {
        cacheKey = 'riwayatSNCache';
        funcName = 'getRiwayatSN';
        funcArgs = [true];
        paintCallback = (data) => { renderRiwayatPusat(); };
      }
      
      const icon = $(btn).find('i');
      icon.addClass('fa-spin text-orange-500');
      
      // Tarik data baru dari server secara diam-diam TANPA memicu skeleton/layar putih
      if(funcName) {
        google.script.run
          .withSuccessHandler(res => {
            icon.removeClass('fa-spin text-orange-500');
            if(res.success) {
              if(cacheKey) _setCache(cacheKey, res.data);
              // Langsung render ulang fungsi tampilannya tanpa lewat loadView()
              if(paintCallback) paintCallback(res.data);
            } else {
              Swal.fire({icon: 'error', title: 'Gagal Refresh', text: res.message, confirmButtonColor: '#f97316'});
            }
          })
          .withFailureHandler(err => {
            icon.removeClass('fa-spin text-orange-500');
            Swal.fire({icon: 'error', title: 'Error Server', text: err.message || 'Gagal menyinkronkan data', confirmButtonColor: '#f97316'});
          })
          [funcName](...funcArgs);
      } else {
        icon.removeClass('fa-spin text-orange-500');
      }
    }

    let currentUser = null;
    let globalMasterData = [];
    let cart = []; 
    let buatsnCart = [];
    let globalListCabang = [];
    let _currentView = ''; // Nama halaman aktif — untuk membatalkan response dari halaman lama
    const _CACHE_TTL = 120000; // 2 menit

    // ── Cache helpers (SWR) ──
    function _getCache(k) {
      try {
        const c = JSON.parse(localStorage.getItem('els_cache_' + k));
        return (c && (Date.now() - c.ts < _CACHE_TTL)) ? c.data : null;
      } catch(e) { return null; }
    }
    
    function _getCacheSWR(k) {
      try {
        const c = JSON.parse(localStorage.getItem('els_cache_' + k));
        if (!c) return { data: null, stale: true };
        return { data: c.data, stale: (Date.now() - c.ts > _CACHE_TTL) };
      } catch(e) { return { data: null, stale: true }; }
    }
    
    function _setCache(k, d) {
      try {
        localStorage.setItem('els_cache_' + k, JSON.stringify({ data: d, ts: Date.now() }));
      } catch(e) {}
    }

    function markLocalCacheStale(k) {
      try {
        const cStr = localStorage.getItem('els_cache_' + k);
        if (cStr) {
          const c = JSON.parse(cStr);
          c.ts = 0; // force stale
          localStorage.setItem('els_cache_' + k, JSON.stringify(c));
        }
      } catch(e) {}
    }

    function markLocalDashboardCacheStale() {
      try {
        for (let i = localStorage.length - 1; i >= 0; i--) {
          const key = localStorage.key(i);
          if (key && key.startsWith('els_cache_dashboard')) {
            const cStr = localStorage.getItem(key);
            if (cStr) {
               const c = JSON.parse(cStr);
               c.ts = 0;
               localStorage.setItem(key, JSON.stringify(c));
            }
          }
        }
      } catch(e) {}
    }

    // ── Skeleton loader ringan (tanpa overlay global) ──
    function _skeleton() {
      return `<div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 animate-pulse mt-2">
        <div class="h-8 bg-slate-200 rounded-xl w-1/4 mb-6"></div>
        <div class="w-full h-10 bg-slate-100 rounded-t-xl border-b border-slate-200 mb-4"></div>
        <div class="space-y-4">
          <div class="h-8 bg-slate-50 rounded-lg w-full"></div>
          <div class="h-8 bg-slate-50 rounded-lg w-full"></div>
          <div class="h-8 bg-slate-50 rounded-lg w-11/12"></div>
          <div class="h-8 bg-slate-50 rounded-lg w-full"></div>
        </div>
      </div>`;
    }

    // ── Silent view fetcher — tidak tampilkan loading overlay ──
    // Gunakan NAMA HALAMAN (bukan token angka) agar lebih reliable.
    // Jika user sudah pindah halaman sebelum response tiba → response dibuang.
    function runGoogleView(viewName, funcName, args, onSuccess) {
      google.script.run
        .withSuccessHandler(res => {
          if (_currentView !== viewName) return; // user pindah halaman, abaikan
          if (res.success) onSuccess(res);
          else $('#contentArea').html(`<div class="text-center mt-10 p-6"><i class="fas fa-exclamation-triangle text-red-400 text-3xl mb-3 block"></i><p class="text-red-500 font-medium">${res.message || 'Gagal memuat data'}</p></div>`);
        })
        .withFailureHandler(err => {
          if (_currentView !== viewName) return;
          $('#contentArea').html(`<div class="text-center mt-10 p-6"><i class="fas fa-server text-red-400 text-3xl mb-3 block"></i><p class="text-red-500 font-medium">${err.message || 'Error koneksi ke server'}</p></div>`);
        })
        [funcName](...args);
    }

    // ── SWR (Stale-While-Revalidate) Fetcher ──
    function runGoogleSWR(viewName, cacheKey, funcName, args, paintFunc) {
      const cache = _getCacheSWR(cacheKey);
      if (cache.data) {
        if ($('#contentArea').children('.animate-pulse').length > 0) $('#contentArea').empty();
        paintFunc(cache.data); // Paint immediately from cache (stale or fresh)
        
        if (!cache.stale) return; // Jika masih fresh, hentikan fetch background untuk hemat kuota!
        
        // Fetch background secara diam-diam
        google.script.run.withSuccessHandler(res => {
          if (_currentView !== viewName) return;
          if (res.success) {
            if (JSON.stringify(cache.data) !== JSON.stringify(res.data)) {
              _setCache(cacheKey, res.data); 
              paintFunc(res.data);
            } else {
              _setCache(cacheKey, cache.data); // Perbarui timestamp
            }
          }
        }).withFailureHandler(() => {})[funcName](...args);
      } else {
        // Tampilkan loading karena data sama sekali kosong
        runGoogleView(viewName, funcName, args, res => { _setCache(cacheKey, res.data); paintFunc(res.data); });
      }
    }

    // GLOBAL APP SCRIPT RUNNER (ERROR HANDLER)
    function runGoogle(funcName, args = [], onSuccess) {
      showLoader();
      google.script.run
        .withSuccessHandler(res => {
          hideLoader();
          if(res.success) onSuccess(res);
          else Swal.fire({icon: 'error', title: 'Gagal', text: res.message, confirmButtonColor: '#f97316'});
        })
        .withFailureHandler(err => {
          hideLoader();
          Swal.fire({icon: 'error', title: 'Error Server', text: err.message || 'Terjadi kesalahan sistem', confirmButtonColor: '#f97316'});
        })
        [funcName](...args);
    }

    const _SESSION_MAX_AGE_MS = 10 * 60 * 60 * 1000; // 10 jam = 36.000.000 ms

    window.onload = () => {
      const storedUser = localStorage.getItem('els_user') || sessionStorage.getItem('els_user');
      if (storedUser) {
        // Cek session expiry hanya untuk localStorage (opsi "Ingat Saya")
        const isRemembered = !!localStorage.getItem('els_user');
        if (isRemembered) {
          const loginTime = parseInt(localStorage.getItem('els_login_time') || '0');
          if (loginTime && (Date.now() - loginTime > _SESSION_MAX_AGE_MS)) {
            localStorage.removeItem('els_user');
            localStorage.removeItem('els_login_time');
            setTimeout(() => Swal.fire({
              icon: 'info', title: 'Sesi Berakhir',
              text: 'Sesi Anda telah berakhir (10 jam). Silakan login kembali.',
              confirmButtonColor: '#f97316'
            }), 300);
            return;
          }
        }
        currentUser = JSON.parse(storedUser);
        showApp();
      }
      
      setInterval(() => {
        if (currentUser && !$('#chatDrawer').hasClass('translate-x-0')) {
          checkUnreadChat();
        }
      }, 60000);
      
      // Auto-refresh setiap 2 jam — gunakan silent refresh (tanpa skeleton/flicker)
      setInterval(() => {
        if (_currentView && currentUser) {
          const safeViews = ['Dashboard', 'List Request Cabang', 'Riwayat SN Keluar', 'Riwayat Request Part', 'Stock / Pricelist', 'SN Masuk'];
          if (safeViews.includes(_currentView)) _silentAutoRefresh();
        }
      }, 7200000);
    };

    // Silent refresh untuk auto-refresh 2 jam — tidak memunculkan skeleton atau loading overlay
    function _silentAutoRefresh() {
      const viewWhenStarted = _currentView;
      const role = String(currentUser.role).toUpperCase();
      const cabang = currentUser.cabang;
      const cfg = {
        'Dashboard':            { f:'getDashboardData',  a:[currentUser.role,cabang,true], k:role==='PUSAT'?'dashboard_v3_PUSAT':`dashboard_v3_${role}_${cabang}`, p:()=>renderDashboard() },
        'Stock / Pricelist':    { f:'getMasterData',     a:[true],                          k:'masterData',                                                           p:()=>renderStock() },
        'SN Masuk':             { f:'getSNMasuk',        a:[true],                          k:'snMasukData',                                                          p:()=>renderSNMasuk() },
        'List Request Cabang':  { f:'getRequestCabang',  a:['PUSAT',cabang,true],            k:`reqCabang_PUSAT_${cabang}`,                                            p:()=>renderRequestTable('PUSAT') },
        'Riwayat Request Part': { f:'getRequestCabang',  a:['CABANG',cabang,true],           k:`reqCabang_CABANG_${cabang}`,                                           p:()=>renderRequestTable('CABANG') },
        'Riwayat SN Keluar':    { f:'getRiwayatSN',      a:[true],                          k:'riwayatSNCache',                                                       p:()=>renderRiwayatPusat() },
      }[viewWhenStarted];
      if (!cfg) return;
      google.script.run
        .withSuccessHandler(res => {
          if (_currentView !== viewWhenStarted) return; // user pindah halaman, abaikan
          if (res.success) { _setCache(cfg.k, res.data); cfg.p(); }
        })
        .withFailureHandler(() => {})
        [cfg.f](...cfg.a);
    }

    function preloadAllData() {
      const role = String(currentUser.role).toUpperCase();
      const cabang = currentUser.cabang;
      
      // 0. Dashboard (yang paling sering dibuka)
      const dashKey = role === 'PUSAT' ? 'dashboard_v3_PUSAT' : `dashboard_v3_${role}_${cabang}`;
      if(!_getCache(dashKey)) {
        google.script.run.withSuccessHandler(res => { if(res.success) _setCache(dashKey, res.data); }).getDashboardData(currentUser.role, cabang);
      }
      
      // 1. Master Data (Pusat & Cabang butuh ini)
      if(!_getCache('masterData')) {
        google.script.run.withSuccessHandler(res => { if(res.success) _setCache('masterData', res.data); }).getMasterData();
      }
      
      // 2. Data Request Cabang
      const reqCacheKey = `reqCabang_${role}_${cabang}`;
      if(!_getCache(reqCacheKey)) {
        google.script.run.withSuccessHandler(res => { if(res.success) _setCache(reqCacheKey, res.data); }).getRequestCabang(role, cabang);
      }
      
      // 3. Khusus Pusat
      if(role === 'PUSAT') {
        if(!_getCache('snMasukData')) {
          google.script.run.withSuccessHandler(res => { if(res.success) _setCache('snMasukData', res.data); }).getSNMasuk();
        }
        if(!_getCache('riwayatSNCache')) {
          google.script.run.withSuccessHandler(res => { if(res.success) _setCache('riwayatSNCache', res.data); }).getRiwayatSN();
        }
      }
    }

      $('#userRoleDisplay').text(currentUser.role.toUpperCase());
      $('#userCabangDisplay').text(currentUser.cabang);
      renderSidebar();

      // Load Dashboard terlebih dahulu (On-Demand) tanpa berebut koneksi
      loadView('Dashboard');
      
      // Pre-warm local cache di background setelah 3 detik agar halaman lain langsung instant
      setTimeout(() => {

    function loadView(viewName, el = null) {
      _currentView = viewName; // Catat halaman aktif sekarang

      $('#pageTitle').text(viewName);
      if(el) {
        $('.menu-item').removeClass('bg-orange-50 text-orange-600').find('i').removeClass('text-orange-500').addClass('text-slate-400');
        $(el).addClass('bg-orange-50 text-orange-600').find('i').removeClass('text-slate-400').addClass('text-orange-500');
        
        // Auto-close sidebar on mobile after clicking menu
        if (window.innerWidth < 768) {
          toggleSidebar();
        }
      }

      // Hanya tampilkan skeleton jika tidak ada cache untuk halaman tersebut
      const _hasCacheForView = (vn) => {
        const keyMap = {
          'Dashboard': (String(currentUser.role).toUpperCase() === 'PUSAT' ? 'dashboard_v3_PUSAT' : `dashboard_v3_${String(currentUser.role).toUpperCase()}_${currentUser.cabang}`),
          'Stock / Pricelist': 'masterData',
          'SN Masuk': 'snMasukData',
          'List Request Cabang': `reqCabang_PUSAT_${currentUser.cabang}`,
          'Riwayat Request Part': `reqCabang_CABANG_${currentUser.cabang}`,
          'Riwayat SN Keluar': 'riwayatSNCache',
        };
        const k = keyMap[vn];
        if (!k) return false;
        try {
          const c = JSON.parse(localStorage.getItem('els_cache_' + k));
          return !!(c && c.data);
        } catch(e) { return false; }
      };

      // Destroy DataTable aktif agar tidak konflik
      ['#stockTable','#tSn','#rTbl','#rwTbl'].forEach(id => {
        if($.fn.DataTable.isDataTable(id)) try { $(id).DataTable().destroy(); } catch(e){}
      });
      // Tampilkan skeleton hanya jika belum ada cache (hindari kedipan)
      if (!_hasCacheForView(viewName)) $('#contentArea').html(_skeleton());

      // Render halaman — konten lama sudah bersih, aman dari race condition
      if(viewName === 'Dashboard')             renderDashboard();
      else if(viewName === 'Stock / Pricelist') renderStock();
      else if(viewName === 'Buat SN')           renderBuatSN();
      else if(viewName === 'SN Masuk')          renderSNMasuk();
      else if(viewName === 'Request Part')      renderRequestPart();
      else if(viewName === 'List Request Cabang')  renderRequestTable('PUSAT');
      else if(viewName === 'Riwayat Request Part') renderRequestTable('CABANG');
      else if(viewName === 'Riwayat SN Keluar')    renderRiwayatPusat();
    }

      const cache = _getCacheSWR('masterData');

              <input type="file" id="fileInput" accept=".xlsx, .xls" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
            </div>
            <div id="fileNameDisplay" class="hidden mt-4 p-3 bg-slate-100 rounded-xl border border-slate-200 flex items-center gap-3">
              <i class="fas fa-file-excel text-emerald-600 text-xl"></i>
              <p id="fileNameText" class="text-sm font-bold text-slate-700 truncate"></p>
            </div>
          </div>
        `,
        showCancelButton: true,
        confirmButtonText: '<i class="fas fa-upload mr-2"></i> Proses Import',
        cancelButtonText: 'Batal',
        confirmButtonColor: type === 'pembelian' ? '#3b82f6' : '#10b981',
        customClass: { popup: 'rounded-2xl' },
        didOpen: () => {
          const dropZone = document.getElementById('dropZone');
          const fileInput = document.getElementById('fileInput');
          const fileNameDisplay = document.getElementById('fileNameDisplay');
          const fileNameText = document.getElementById('fileNameText');
          
          ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(evt => dropZone.addEventListener(evt, e => { e.preventDefault(); e.stopPropagation(); }, false));
          ['dragenter', 'dragover'].forEach(evt => dropZone.addEventListener(evt, () => dropZone.classList.add('border-orange-500', 'bg-orange-50'), false));
          ['dragleave', 'drop'].forEach(evt => dropZone.addEventListener(evt, () => dropZone.classList.remove('border-orange-500', 'bg-orange-50'), false));
          
          dropZone.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            if(dt.files && dt.files.length > 0) {
              fileInput.files = dt.files;
              fileNameText.innerText = dt.files[0].name;
              fileNameDisplay.classList.remove('hidden');
            }
          }, false);
          
          fileInput.addEventListener('change', function() {
            if(this.files && this.files.length > 0) {
              fileNameText.innerText = this.files[0].name;
              fileNameDisplay.classList.remove('hidden');
            }
          });
        },
        preConfirm: () => {
          const fileInput = document.getElementById('fileInput');
          if(!fileInput.files || fileInput.files.length === 0) {
            Swal.showValidationMessage('Silakan pilih file Excel terlebih dahulu');
            return false;
          }
          return fileInput.files[0];
        }
      }).then((result) => {
        if(result.isConfirmed) processExcelFile(result.value, type);
      });
    }

    function processExcelFile(file, type) {
      Swal.fire({
        title: '<div class="text-lg font-bold text-slate-800">Memproses Data...</div>',
        html: `
          <div class="mt-4 text-left">
            <div class="flex justify-between text-sm mb-2">
              <span id="pgText" class="font-medium text-slate-600">Membaca file lokal...</span>
              <span id="pgPct" class="font-bold text-orange-500">0%</span>
            </div>
            <div class="w-full bg-slate-200 rounded-full h-3 overflow-hidden">
              <div id="pgBar" class="bg-orange-500 h-3 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
          </div>
        `,
        showConfirmButton: false,
        allowOutsideClick: false,
        allowEscapeKey: false,
        didOpen: () => {
          const updatePg = (pct, text) => {
            if(document.getElementById('pgBar')) {
              document.getElementById('pgBar').style.width = pct + '%';
              document.getElementById('pgText').innerText = text;
              document.getElementById('pgPct').innerText = pct + '%';
            }
          };
          
          setTimeout(() => updatePg(15, 'Menganalisis file Excel...'), 200);
          
          const reader = new FileReader();
          reader.onload = function(evt) {
            setTimeout(() => updatePg(35, 'Mengekstrak baris & kolom...'), 500);
            
            try {
              const wb = XLSX.read(new Uint8Array(evt.target.result), {type: 'array'});
              const parsed = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {range: 2}); 
              
              if(parsed.length === 0) {
                return Swal.fire('File Kosong', 'File Excel tidak memiliki baris data yang valid.', 'error');
              }
              
              setTimeout(() => updatePg(70, 'Mensinkronisasi dengan Server...'), 800);
              
              google.script.run
                .withSuccessHandler(r => {
                  updatePg(100, 'Selesai!');
                  setTimeout(() => {
                    if(r.success) {
                      let dupHtml = '';
                      if (r.duplicates && r.duplicates.length > 0) {
                        dupHtml = `<div class="mt-3 p-3 bg-red-50 rounded-lg border border-red-200">
                                     <p class="text-sm font-bold text-red-700 mb-1"><i class="fas fa-exclamation-triangle"></i> Ditemukan ${r.duplicates.length} SN Ganda (Abaikan):</p>
                                     <div class="max-h-24 overflow-y-auto text-xs font-mono text-red-600 bg-white p-2 rounded border border-red-100">
                                       ${r.duplicates.join('<br>')}
                                     </div>
                                   </div>`;
                      }
                      
                      Swal.fire({
                        icon: 'success',
                        title: 'Import Selesai!',
                        html: `<div class="text-left mt-2 bg-emerald-50 p-4 rounded-xl border border-emerald-200">
                                <ul class="list-disc list-inside text-sm text-emerald-800 space-y-1">
                                  <li>Data Baru (Diinput): <b class="text-lg">${r.newCount}</b> Item</li>
                                  <li>Data Terupdate (Stok Naik): <b class="text-lg">${r.updatedCount}</b> Item</li>
                                </ul>
                               </div>
                               ${dupHtml}`,
                        confirmButtonText: 'Tutup'
                      }).then(() => {
                        // Reload table data
                        runGoogleView('Stock / Pricelist', 'getMasterData', [], res => {
                          globalMasterData = res.data; _setCache('masterData', res.data);
                          renderStock();
                        });
                      });
                    } else {
                      Swal.fire('File Tidak Sesuai', r.message, 'warning');
                    }
                  }, 500);
                })
                .withFailureHandler(err => {
                  Swal.fire('Error Server', String(err), 'error');
                })
                .bulkUpdateMaster(type, parsed);
                
            } catch(e) {
              Swal.fire('Format Gagal', 'Struktur file rusak atau tidak didukung oleh pembaca Excel.', 'error');
            }
          };
          reader.onerror = () => Swal.fire('Error Lokal', 'Browser gagal membaca file Anda.', 'error');
          reader.readAsArrayBuffer(file);
        }
      });
    }

          if (val === '' || val < 0) { Swal.showValidationMessage('Masukkan angka harga yang valid'); return false; }
          return val;
        }
      }).then(r => {
        if (r.isConfirmed) {
          const newPrice = r.value;
          runGoogle('updateHargaModal', [kode, newPrice], res => {
             Swal.fire({title: 'Berhasil', text: res.message, icon: 'success', timer: 1500, showConfirmButton: false, toast: true, position: 'top-end'});
             
             // Update DOM cell quietly
             const formatted = 'Rp ' + Number(newPrice).toLocaleString('id');
             $(btn).attr('data-harga', newPrice);
             $(btn).siblings('.harga-text').text(formatted).addClass('text-emerald-600').removeClass('text-slate-700');
             setTimeout(() => $(btn).siblings('.harga-text').removeClass('text-emerald-600').addClass('text-slate-700'), 1500);
             
             // Update local cache
             try {
                const cacheStr = localStorage.getItem('els_cache_masterData');
                if (cacheStr) {
                   const cache = JSON.parse(cacheStr);
                   if (cache.data) {
                      const item = cache.data.find(x => (x['Kode Barang']||x['kode barang']) === kode);
                      if (item) {
                         if (item['Harga Modal'] !== undefined) item['Harga Modal'] = newPrice;
                         else if (item['harga modal'] !== undefined) item['harga modal'] = newPrice;
                         localStorage.setItem('els_cache_masterData', JSON.stringify(cache));
                         globalMasterData = cache.data;
                      }
                   }
                }
             } catch(e) {}
          });
        }
      });
    }

              _setCache('masterData', res.data);
              
              // Cek apakah user sedang berinteraksi. Jika iya, update datanya secara diam-diam

    function addSnCart() {
      const nota = $('#snNota').val(), k = $('#snKode').val(), q = parseInt($('#snQty').val());
      if(!nota) return Swal.fire('Perhatian', 'Isi No Nota dulu!', 'warning');
      if(!k||!q) return Swal.fire('Perhatian', 'Barang & Qty harus diisi', 'warning');
      
      const item = globalMasterData.find(m => (m['Kode Barang']||m['kode barang']) === k);
      if(!item) return Swal.fire('Error', 'Barang tidak valid', 'error');
      
      const ex = buatsnCart.find(c => c.kode === k);
      if(ex) ex.qty += q; else buatsnCart.push({ kode: k, nama: item['Nama Barang']||item['nama barang'], qty: q });
      
      $('#snKode').val(''); $('#snQty').val(1);

    function copyToClipboard(text) {
      if(navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(() => {
          Swal.fire({icon: 'success', title: 'Tersalin!', text: 'Semua SN telah disalin ke clipboard.', timer: 1500, showConfirmButton: false});
        });
      } else {
        const textArea = document.createElement("textarea");
        textArea.value = text;
        document.body.appendChild(textArea);
        textArea.select();
        try {
          document.execCommand('copy');
          Swal.fire({icon: 'success', title: 'Tersalin!', text: 'Semua SN telah disalin ke clipboard.', timer: 1500, showConfirmButton: false});
        } catch (err) {
          Swal.fire('Gagal Menyalin', 'Fitur copy tidak didukung di browser ini.', 'error');
        }
        document.body.removeChild(textArea);
      }
    }

              snFontSize: parseInt($('#pSnFs').val()),

              scale: parseInt($('#pScale').val())

           try {
              const toSave = {...cfg};
              delete toSave.snList;
              localStorage.setItem('els_print_config', JSON.stringify(toSave));
           } catch(e) {}
           
           return cfg;
        }
      }).then(r => {
        if(r.isConfirmed) executePrint(r.value);
      });

    function executePrint(cfg) {
      const [w, h] = cfg.preset.split('x'); // w = width mm, h = height mm
      
      // Mengatur tata letak Flexbox berdasarkan pilihan posisi teks
      let flexDir = 'column';
      if(cfg.textPos === 'right') flexDir = 'row';
      else if(cfg.textPos === 'left') flexDir = 'row-reverse';
      else if(cfg.textPos === 'top') flexDir = 'column-reverse';
      
      let phtml = `<style>
        @media print {
          @page { size: ${w}mm ${h}mm; margin: 0 !important; }
          html, body { margin: 0 !important; padding: 0 !important; }
          /* Menyembunyikan elemen UI utama saat mencetak */
          #appView { display: none !important; }
        }
        
        .print-wrapper {
          transform: scale(${cfg.scale / 100});
          transform-origin: top left;
          width: 100%;
        }
        
        .lbl-box { 
          width: ${w}mm; 
          height: ${h}mm; 
          box-sizing: border-box; 
          padding: ${cfg.marginT}mm ${cfg.marginR}mm ${cfg.marginB}mm ${cfg.marginL}mm;
          overflow: hidden; 
          display: flex; 
          flex-direction: ${flexDir};
          align-items: ${cfg.anchorPos}; 
          justify-content: ${cfg.anchorPos};
          gap: ${cfg.gap}mm; 
          page-break-inside: avoid;
          break-inside: avoid;
          font-family: sans-serif;
        }
        .lbl-qr { flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
        .lbl-qr img, .lbl-qr canvas { width: ${cfg.barcodeSize}px !important; height: ${cfg.barcodeSize}px !important; }
        .lbl-qr svg { height: ${cfg.barcodeSize}px !important; }
        .lbl-txt { 
          flex-grow: 1; 
          display: flex; 
          flex-direction: column; 
          justify-content: center; 
          text-align: ${cfg.align}; 
          min-width: 0;
        }
        .sn-txt { font-weight: bold; font-size: ${cfg.snFontSize}px; margin-bottom: 1px; line-height: 1; word-wrap: break-word; }
        .nm-txt { font-size: ${cfg.fontSize}px; line-height: 1.1; word-wrap: break-word; }
      </style><div class="print-wrapper">`;
      
      cfg.snList.forEach((item, i) => {
        let txtHtml = `<div class="sn-txt">${item.sn}</div>`;
        
        let subTxt = '';
        if(cfg.textDisplay === 'sn_nm') subTxt = item.nm;
        else if(cfg.textDisplay === 'sn_kd') subTxt = item.kd;
        else if(cfg.textDisplay === 'sn_kd_nm') subTxt = `${item.kd} - ${item.nm}`;
        
        if(subTxt) txtHtml += `<div class="nm-txt">${subTxt}</div>`;
        
        phtml += `<div class="lbl-box">
           <div class="lbl-qr">
              ${cfg.algo === 'qrcode' ? `<div id="qr_${i}"></div>` : `<svg id="bc_${i}"></svg>`}
           </div>
           <div class="lbl-txt">${txtHtml}</div>
        </div>`;
      });
      
      phtml += `</div>`;
      $('#printContainer').html(phtml).removeClass('hidden');
      
      // Render Barcodes
      cfg.snList.forEach((item, i) => {
        if(cfg.algo === 'qrcode') {
           // Render 4x lebih besar agar tidak blur saat dicetak
           new QRCode(document.getElementById(`qr_${i}`), { text: item.sn, width: cfg.barcodeSize * 4, height: cfg.barcodeSize * 4, colorDark: "#000", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.L });
        } else {
           if(typeof JsBarcode !== 'undefined') {
             JsBarcode(`#bc_${i}`, item.sn, {
               format: cfg.algo === 'code39' ? "CODE39" : "CODE128",
               width: 1.5,
               height: cfg.barcodeSize,
               displayValue: false,
               margin: 0
             });
           } else {
             Swal.fire('Error', 'Library JsBarcode gagal dimuat', 'error');
           }
        }
      });
    
      // Beri waktu 800ms agar rendering Svg/Canvas selesai, lalu eksekusi Print
      setTimeout(() => {
        window.print();
        $('#printContainer').addClass('hidden').html(''); // cleanup setelah dialog tertutup
      }, 800);
    }

    // 6. LIST & ALOKASI
    function renderRequestTable(role) {
      const VN = role === 'PUSAT' ? 'List Request Cabang' : 'Riwayat Request Part';

      const _paintReq = (data) => {
        if(!data || !data.length) return $('#contentArea').html(`<p class="text-center mt-10 text-slate-400"><i class="fas fa-inbox text-slate-300 text-4xl mb-4 block"></i>Belum ada data request</p>`);
        let html = `<div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 animate-fade-in"><table id="rTbl" class="w-full text-left text-sm">
          <thead class="sticky top-0 z-10 bg-slate-50 shadow-sm"><tr class="border-b">
            <th class="p-4">ID Request</th><th class="p-4">Tgl</th>
            ${role==='PUSAT'?`<th class="p-4">Cabang</th>`:''}

            ${role==='PUSAT'?`<th class="p-4 text-center">Alokasi</th>`:''}
          </tr></thead><tbody>`;
        data.forEach(r => {
          let reqId = r['ID Request'] || r['id request'] || r['ID'] || r['id'] || r['No. Request'] || r['no. request'] || '-';
          let rawItems = r['Detail Items'] || r['detail items'] || r['Data Item'] || r['data item'] || r['Data Items'] || '[]';
          let rawStatus = r['Status'] || r['status'] || 'Menunggu';
          
          // Auto-fix jika kolom Status dan Detail Items terbalik di Google Sheet
          if (String(rawStatus).trim().startsWith('[')) {
            const temp = rawItems;
            rawItems = rawStatus;
            rawStatus = temp || 'Menunggu';
          }
          if (String(rawStatus).trim() === '[]' || !rawStatus) rawStatus = 'Menunggu';
          
          let items = []; try{ items = JSON.parse(rawItems); } catch(e){}
          let list = items.map(i=>`<span class="bg-slate-100 text-xs px-2 py-1 rounded border m-1 inline-block"><b>${i.qty}x</b> ${escapeHtml(i.nama)}</span>`).join('');
          let stat = String(rawStatus);
          let statColor = stat.includes('Selesai') ? 'text-emerald-700 bg-emerald-100' : 'text-orange-700 bg-orange-100';
          
          html += `<tr class="border-b hover:bg-slate-50"><td class="p-4 font-mono text-xs">${reqId}</td><td class="p-4 whitespace-nowrap">${new Date(r['Tanggal']||r['tanggal']).toLocaleDateString('id')}</td>
          ${role==='PUSAT'?`<td class="p-4 font-bold">${r['Cabang']||r['cabang']||'-'}</td>`:''}
          <td class="p-4 max-w-xs">${list}</td><td class="p-4"><span class="px-2 py-1 rounded text-xs font-bold ${statColor}">${stat}</span></td>
          ${role==='PUSAT'?`<td class="p-4 text-center whitespace-nowrap">
             ${!stat.includes('Selesai')?`<button onclick="openAloModal('${reqId}',${r._rowIndex},'${r['Cabang']||''}')" class="bg-emerald-50 text-emerald-600 border border-emerald-200 px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-emerald-100 mr-1" title="Alokasi"><i class="fas fa-check-circle"></i> Alokasi</button>`:`<span class="text-emerald-500 font-bold text-xs mr-2"><i class="fas fa-check"></i> Selesai</span>`}
             <button onclick="deleteRequestCabangUI('${reqId}')" class="bg-red-50 text-red-600 border border-red-200 px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-red-100" title="Hapus"><i class="fas fa-trash"></i></button>
          </td>`:''}</tr>`;
        });
        
        if(_currentView !== VN) return;
        if($.fn.DataTable.isDataTable('#rTbl')) try{$('#rTbl').DataTable().destroy();}catch(e){}
        $('#contentArea').html(html + '</tbody></table></div>');
        $('#rTbl').DataTable({ responsive: true, paging: false, info: true, order: [[1, 'desc']], language: { search: '', searchPlaceholder: 'Cari data...' } });
        
        $('#rTbl').wrap('<div class="max-h-[65vh] overflow-y-auto rounded-xl border border-slate-200 mt-4"></div>');
        
        const filter = $('#rTbl_filter');
        filter.css({'float': 'none', 'text-align': 'left'});
        filter.addClass('flex w-full');
        filter.find('label').addClass('w-full flex items-center');
        filter.find('input').addClass('w-full !ml-0 rounded-xl px-4 py-2 border-slate-300 focus:border-blue-500 focus:ring-blue-500').attr('placeholder', 'Cari ID, Cabang, atau Status...');

        if($('#rTbl_filter .btn-refresh').length === 0) {
          filter.append(`<button onclick="forceRefresh(this)" class="btn-refresh ml-3 bg-slate-100 hover:bg-slate-200 text-slate-600 px-4 py-2 rounded-xl border border-slate-200 transition-colors flex-shrink-0" title="Refresh Data"><i class="fas fa-sync-alt"></i></button>`);
        }
      };
      
      runGoogleSWR(VN, cacheKey, 'getRequestCabang', [role, currentUser.cabang], _paintReq);
    }

    function deleteRequestCabangUI(reqId) {
      Swal.fire({
        title: 'Hapus Request?',
        text: `Anda yakin ingin menghapus request dengan ID: ${reqId}?`,
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#ef4444',
        cancelButtonColor: '#94a3b8',
        confirmButtonText: '<i class="fas fa-trash mr-1"></i> Ya, Hapus!',
        cancelButtonText: 'Batal',
        customClass: { popup: 'rounded-2xl' }
      }).then((result) => {
        if (result.isConfirmed) {
          runGoogle('deleteRequestCabang', [reqId], res => {
            if (res.success) {
              Swal.fire({title: 'Terhapus!', text: res.message, icon: 'success', timer: 1500, showConfirmButton: false});
              markLocalDashboardCacheStale();
              try {
                const cacheKey = `reqCabang_PUSAT_${currentUser.cabang}`;
                const cacheStr = localStorage.getItem('els_cache_' + cacheKey);
                if (cacheStr) {
                   const cache = JSON.parse(cacheStr);
                   if (cache.data) {
                      cache.data = cache.data.filter(x => {
                          let id = x['ID Request'] || x['id request'] || x['ID'] || x['id'] || x['No. Request'] || x['no. request'];
                          return id !== reqId;
                      });
                      localStorage.setItem('els_cache_' + cacheKey, JSON.stringify(cache));
                   }
                }
              } catch(e) {}
              loadView('List Request Cabang');
            } else {
              Swal.fire('Gagal', res.message, 'error');
            }
          });
        }
      });
    }

    function toggleTgt(val) {
      const wCabang = document.getElementById('wCabang');
      const wUser   = document.getElementById('wUser');
      if(!wCabang || !wUser) return;
      if(val==='Cabang') {
        wCabang.classList.remove('hidden'); wUser.classList.add('hidden');
      } else {
        wCabang.classList.add('hidden'); wUser.classList.remove('hidden');

        filter.find('input').addClass('w-full !ml-0 rounded-xl px-4 py-2 border-slate-300 focus:border-blue-500 focus:ring-blue-500').attr('placeholder', 'Cari Riwayat SN...');
        
        if($('#rwTbl_filter .btn-refresh').length === 0) {
          filter.append(`<button onclick="forceRefresh(this)" class="btn-refresh ml-3 bg-slate-100 hover:bg-slate-200 text-slate-600 px-4 py-2 rounded-xl border border-slate-200 transition-colors flex-shrink-0" title="Refresh Data"><i class="fas fa-sync-alt"></i></button>`);
        }
      };
      
      runGoogleSWR(VN, 'riwayatSNCache', 'getRiwayatSN', [], _paintRiwayat);
    }

    // ==========================================
    // CHAT SYSTEM LOGIC
    // ==========================================
    let currentChatCabang = null;

    function checkUnreadChat() {
      if(!currentUser) return;
      google.script.run
        .withSuccessHandler(res => {
          if (res.success && res.count > 0) {
            $('#chatUnreadDot').removeClass('hidden');
          } else {
            $('#chatUnreadDot').addClass('hidden');
          }
        })
        .withFailureHandler(() => {})
        .getChatUnreadCount(currentUser.role, currentUser.cabang);
    }

    function toggleChatDrawer() {
      const isClosed = $('#chatDrawer').hasClass('translate-x-full');
      if (isClosed) {
        $('#chatDrawer').removeClass('translate-x-full');
        $('#chatDrawerOverlay').removeClass('hidden');
        $('#chatUnreadDot').addClass('hidden'); // Sembunyikan notif saat dibuka
        loadChatList();
      } else {
        $('#chatDrawer').addClass('translate-x-full');
        $('#chatDrawerOverlay').addClass('hidden');
        currentChatCabang = null;
      }
    }

    function loadChatList() {
      $('#btnBackChat').addClass('hidden');
      $('#chatDrawerFooter').addClass('hidden');
      
      if (String(currentUser.role).toUpperCase() === 'PUSAT') {
        $('#chatDrawerTitle').text('Daftar Percakapan');
        $('#chatDrawerBody').html('<div class="flex items-center justify-center h-full text-slate-400"><i class="fas fa-spinner fa-spin text-2xl"></i></div>');
        
        google.script.run
          .withSuccessHandler(res => {
            if(res.success) {
              if (res.data.length === 0) {
                $('#chatDrawerBody').html('<div class="flex flex-col items-center justify-center h-full text-slate-400"><i class="fas fa-users-slash text-4xl mb-3"></i><p>Belum ada data cabang.</p></div>');
                return;
              }
              let html = res.data.map(c => `
                <div onclick="openChatThread('${c.cabang}')" class="bg-white p-3 rounded-xl border border-slate-100 hover:border-orange-300 hover:shadow-sm cursor-pointer transition-all flex items-center gap-3">
                  <div class="w-10 h-10 bg-slate-100 rounded-full flex items-center justify-center text-slate-500 shrink-0 relative">
                    <i class="fas fa-store"></i>
                    ${c.unread > 0 ? `<span class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] font-bold w-4 h-4 flex items-center justify-center rounded-full border-2 border-white">${c.unread}</span>` : ''}
                  </div>
                  <div class="flex-1 min-w-0">
                    <h4 class="font-bold text-slate-700 text-sm truncate">${c.cabang}</h4>
                    <p class="text-xs text-slate-500 truncate">${c.lastMessage ? escapeHtml(c.lastMessage) : '<i>Belum ada pesan</i>'}</p>
                  </div>
                </div>
              `).join('');
              $('#chatDrawerBody').html(html);
            } else {
              $('#chatDrawerBody').html(`<div class="text-center text-red-500 mt-10">${res.message}</div>`);
            }
          })
          .withFailureHandler(err => {
             $('#chatDrawerBody').html(`<div class="text-center text-red-500 mt-10">Koneksi Error</div>`);
          })
          .getChatList(currentUser.role, currentUser.cabang);
      } else {
        // Cabang langsung buka thread-nya sendiri
        openChatThread(currentUser.cabang);
      }
    }

    function openChatThread(cabang) {
      currentChatCabang = cabang;
      const isPusat = String(currentUser.role).toUpperCase() === 'PUSAT';
      
      if (isPusat) {
        $('#btnBackChat').removeClass('hidden');
        $('#chatDrawerTitle').text(cabang);
      } else {
        $('#chatDrawerTitle').text('Chat dengan Pusat');
      }
      
      $('#chatDrawerFooter').removeClass('hidden');
      $('#chatDrawerBody').html('<div class="flex items-center justify-center h-full text-slate-400"><i class="fas fa-spinner fa-spin text-2xl"></i></div>');
      
      google.script.run
        .withSuccessHandler(res => {
          if (res.success) {
            renderChatMessages(res.data);
            checkUnreadChat(); // Hilangkan notif utama jika sudah read
          } else {
            $('#chatDrawerBody').html(`<div class="text-center text-red-500 mt-10">${res.message}</div>`);
          }
        })
        .withFailureHandler(err => {
            $('#chatDrawerBody').html(`<div class="text-center text-red-500 mt-10">Koneksi Error</div>`);
        })
        .getChatMessages(cabang, currentUser.role);
    }

    function closeChatThread() {
      currentChatCabang = null;
      loadChatList();
    }

    function renderChatMessages(messages) {
      if (messages.length === 0) {
        $('#chatDrawerBody').html('<div class="flex flex-col items-center justify-center h-full text-slate-400 opacity-50"><i class="fas fa-comments text-5xl mb-3"></i><p class="text-sm">Kirim pesan pertama Anda</p></div>');
        return;
      }
      
      const isPusat = String(currentUser.role).toUpperCase() === 'PUSAT';
      let html = '';
      
      messages.forEach(msg => {
        const isMe = (isPusat && msg.pengirim === 'PUSAT') || (!isPusat && msg.pengirim !== 'PUSAT');
        const time = new Date(msg.waktu).toLocaleTimeString('id', { hour: '2-digit', minute: '2-digit' });
        
        if (isMe) {
          html += `
            <div class="flex justify-end animate-fade-in">
              <div class="bg-orange-500 text-white rounded-2xl rounded-tr-none px-4 py-2 max-w-[85%] shadow-sm">
                <p class="text-sm">${escapeHtml(msg.pesan)}</p>
                <p class="text-[10px] text-orange-200 text-right mt-1">${time}</p>
              </div>
            </div>
          `;
        } else {
          html += `
            <div class="flex justify-start animate-fade-in">
              <div class="bg-white border border-slate-200 text-slate-700 rounded-2xl rounded-tl-none px-4 py-2 max-w-[85%] shadow-sm">
                <p class="text-[10px] font-bold text-slate-400 mb-1">${escapeHtml(msg.pengirim)}</p>
                <p class="text-sm">${escapeHtml(msg.pesan)}</p>
                <p class="text-[10px] text-slate-400 text-right mt-1">${time}</p>
              </div>
            </div>
          `;
        }
      });
      
      const body = $('#chatDrawerBody');
      body.html(html);
      body.scrollTop(body[0].scrollHeight);
    }

    function doSendChatMessage(e) {
      e.preventDefault();
      const input = $('#chatInput');
      const msg = input.val().trim();
      if (!msg || !currentChatCabang) return;
      
      input.val('');
      const btn = $('#btnSendChat');
      btn.html('<i class="fas fa-spinner fa-spin text-sm"></i>');
      
      // Optimistic Update
      const time = new Date().toLocaleTimeString('id', { hour: '2-digit', minute: '2-digit' });
      const placeholderHtml = `
        <div class="flex justify-end animate-fade-in opacity-70">
          <div class="bg-orange-500 text-white rounded-2xl rounded-tr-none px-4 py-2 max-w-[85%] shadow-sm">
            <p class="text-sm">${escapeHtml(msg)}</p>
            <p class="text-[10px] text-orange-200 text-right mt-1"><i class="far fa-clock"></i></p>
          </div>
        </div>
      `;
      // Hapus state kosong jika ada
      if ($('#chatDrawerBody').find('.fa-comments').length > 0) {
          $('#chatDrawerBody').html('');
      }
      $('#chatDrawerBody').append(placeholderHtml);
      const body = $('#chatDrawerBody');
      body.scrollTop(body[0].scrollHeight);
      
      google.script.run
        .withSuccessHandler(res => {
          btn.html('<i class="fas fa-paper-plane text-sm"></i>');
          if (res.success) {
            // Re-fetch clean messages to ensure sync and right order
            google.script.run
              .withSuccessHandler(res2 => { if(res2.success) renderChatMessages(res2.data); })
              .getChatMessages(currentChatCabang, currentUser.role);
          } else {
            Swal.fire('Gagal', res.message, 'error');
          }
        })
        .withFailureHandler(() => {
           btn.html('<i class="fas fa-paper-plane text-sm"></i>');
           Swal.fire('Error', 'Koneksi terputus', 'error');
        })
        .saveChatMessage(currentChatCabang, currentUser.role, currentUser.username, msg);
    }

  </script>
</body>
</html>
